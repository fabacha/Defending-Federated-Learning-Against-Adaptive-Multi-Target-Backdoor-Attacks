# Multi-label BadNet / foolsgold; matched 100-round submission.
# Attack settings from yamls/BadNet/BadNet_multi_label_nodefense.yaml; defense settings from the corresponding baseline.
resumed_model: saved_models/ResNet_18_cifar10_ptm_2000_benign.pt
data_dir: data
load_data_from_pkl: false
pre_cache_data_path: data/pre_cached_data.pt.tar
save_on_iteration:
- 2099
benign_lr: 0.1
benign_momentum: 0.9
benign_weight_decay: 0.0005
benign_is_projection_grad: false
benign_projection_norm: 3
benign_retrain_no_times: 2
gamma: 1
target_lr: 0.02
lr_method: linear
poisoned_lr: 0.01
poisoned_momentum: 0.9
poisoned_weight_decay: 0.0005
poisoned_is_projection_grad: false
poisoned_projection_norm: 5
poisoned_retrain_no_times: 5
poisoned_iteration_interval: 1
malicious_aggregate_all_layer: 1
poison_task_name: BadNets multi-label patch
pixel_pattern: true
poison_train_batch_size: 64
norm_clip: false
fix_nc_bound: true
nc_bound: 2
agg_method: FedProx
Fedprox_mu: 0
sample_dirichlet: true
dirichlet_alpha: 1
train_batch_size: 64
test_batch_size: 1000
no_of_total_participants: 100
no_of_participants_per_iteration: 10
poisoned_pattern_choose: 1
blend_alpha: 0.3
poison_label_swap:
- 0
- 1
- 2
- 3
- 4
round_ndigits: 4
badnet_shared_trigger: false
badnet_trigger_value: 1.0
badnet_trigger_color:
- 1.0
- 0.0
- 0.0
show_train_log: false
start_iteration: 2000
end_iteration: 2100
start_save_iteration: 9999
poisoned_start_iteration: 2000
poisoned_end_iteration: 2100
poisoned_len: 16
trigger_size: 5
seed: 123
malicious_train_algo: BadNet
defense_method: foolsgold
foolsgold_kappa: 1.0

foolsgold_server_lr: 0.1  # ten-client server step; reference weighted sum uses 1.0
foolsgold_use_history: true
foolsgold_indicative_layers: auto
foolsgold_max_update_norm: 1.0
client_sampling_seed: 123
